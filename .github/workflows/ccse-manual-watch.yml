name: Vigilante del Manual CCSE

# Cada lunes comprueba si el banco de preguntas coincide con el último manual
# oficial del Instituto Cervantes, publica el estado en el panel de admin y
# envía el informe semanal por correo. También se puede lanzar a mano.
on:
  schedule:
    - cron: "0 6 * * 1"   # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r tools/requirements.txt

      - name: Comparar el banco con el manual oficial
        run: python tools/check_ccse_manual.py

      - name: Resumen del informe
        if: always()
        run: |
          if [ -f manual-report/report.md ]; then
            cat manual-report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar estado en el panel de admin
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python tools/publish_manual_status.py

      - name: Enviar informe semanal por correo
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python tools/send_manual_report.py

      - name: Guardar informe como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-report
          path: manual-report/
          retention-days: 30
