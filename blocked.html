<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso bloqueado - CCSE</title>
    <link rel="stylesheet" href="css/style.css?v=20260903-1">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Acceso bloqueado</h1>
                <p class="muted">Tu cuenta no puede generar actividad en este momento.</p>
            </div>
            <button id="logout-btn" class="btn btn-secondary">Cerrar sesión</button>
        </header>
        <main>
            <p class="error-message">
                Esta cuenta ha sido bloqueada por el administrador. Si crees que se trata de un error,
                contacta con el responsable de la aplicación.
            </p>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js?v=20260903-1"></script>
</body>
</html>
